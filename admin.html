<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord – Backyard des Gaziers 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="bar-top">
    <h1 style="font-size:2.4rem">Tableau de bord</h1>
    <button class="small" id="logout" hidden>Se déconnecter</button>
  </div>
  <form id="login" style="margin-top:18px">
    <input type="password" name="cle" placeholder="Mot de passe organisateur" aria-label="Mot de passe organisateur" autocomplete="current-password" required>
    <button class="go" type="submit">Ouvrir</button>
  </form>
  <div class="msg" id="loginMsg" aria-live="polite"></div>
  <div id="dash" hidden>
    <p class="status" id="maj"></p>
    <div class="kpis">
      <div class="kpi"><b id="k-total">–</b><span>inscriptions sur 108</span></div>
      <div class="kpi"><b id="k-manque">–</b><span>places à pourvoir</span></div>
      <div class="kpi"><b id="k-pire">–</b><span>bloc le moins rempli</span></div>
    </div>
    <div id="blocs"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const CAP = 18;
const BLOCS = [['12h-16h',0],['16h-20h',0],['20h-24h',1],['0h-4h',1],['4h-8h',1],['8h-12h',0]];
let rows = [], cle = '', timer = null;
const $ = s => document.querySelector(s);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const store = { get(){ try{return sessionStorage.getItem('bg-cle')||'';}catch{return '';} },
                set(v){ try{ v?sessionStorage.setItem('bg-cle',v):sessionStorage.removeItem('bg-cle'); }catch{} } };

async function api(body){
  const r = await fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const d = await r.json();
  if (!d.ok) throw new Error(d.erreur || 'Erreur inconnue.');
  return d;
}

function render(){
  const total=rows.length;
  $('#k-total').textContent=total;
  $('#k-manque').textContent=Math.max(0,BLOCS.length*CAP-total);
  const counts=BLOCS.map(([id])=>[id,rows.filter(r=>r.bloc===id).length]).sort((a,b)=>a[1]-b[1]);
  $('#k-pire').textContent=counts[0][0].replace('-','–');
  $('#maj').textContent='Mis à jour à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'. Actualisation automatique toutes les 30 s.';
  $('#blocs').innerHTML=BLOCS.map(([id,night])=>{
    const list=rows.filter(r=>r.bloc===id).sort((a,b)=>a.t-b.t), n=list.length, manque=CAP-n;
    return `<section class="bloc${night?' night':''}">
      <div class="head"><h2>${id.replace('-','–')}</h2><span>${n}/${CAP}${manque>0?` (il manque ${manque})`:' (complet)'}</span></div>
      <div class="bar"><i style="width:${Math.min(100,n/CAP*100)}%"></i></div>
      ${n?`<table>${list.map(r=>`<tr><td>${esc(r.nom)}</td><td>${r.tel?`<a href="tel:${esc(r.tel)}">${esc(r.tel)}</a>`:''}</td><td style="text-align:right"><button class="small del" data-id="${esc(r.id)}" data-nom="${esc(r.nom)}">Retirer</button></td></tr>`).join('')}</table>
      <div class="tools"><button class="small" data-copy="${id}">Copier les numéros</button></div>`:'<p class="hint" style="margin:0">Personne pour l’instant.</p>'}
    </section>`;}).join('');
}

async function load(){
  try { const d = await api({action:'admin', cle}); rows = d.lignes; render(); return true; }
  catch (err) { $('#maj').textContent = err.message; return false; }
}

async function open(v){
  cle = v; $('#loginMsg').textContent = 'Vérification…';
  try {
    const d = await api({action:'admin', cle});
    rows = d.lignes; store.set(cle);
    $('#login').hidden = true; $('#loginMsg').textContent = '';
    $('#dash').hidden = false; $('#logout').hidden = false;
    render(); clearInterval(timer); timer = setInterval(load, 30000);
  } catch (err) {
    store.set(''); $('#loginMsg').style.color='var(--err)'; $('#loginMsg').textContent = err.message;
  }
}

$('#login').addEventListener('submit', e => { e.preventDefault(); open(e.target.cle.value); });
$('#logout').addEventListener('click', () => { store.set(''); location.reload(); });

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.id) {
    if (!confirm('Retirer ' + b.dataset.nom + ' de ce bloc ?')) return;
    b.disabled = true;
    try { const d = await api({action:'supprimer', cle, id:b.dataset.id}); rows = d.lignes; render(); }
    catch { b.disabled = false; alert('Le retrait n’est pas passé.'); }
  } else if (b.dataset.copy) {
    const nums = rows.filter(r=>r.bloc===b.dataset.copy && r.tel).map(r=>r.tel).join(', ');
    try { await navigator.clipboard.writeText(nums); b.textContent='Copié'; setTimeout(()=>b.textContent='Copier les numéros',1500); }
    catch { prompt('Numéros :', nums); }
  }
});

if (!window.API_URL || window.API_URL.startsWith('COLLE')) {
  $('#loginMsg').textContent = 'Site pas encore relié : colle l’URL Apps Script dans config.js.';
} else { const saved = store.get(); if (saved) open(saved); }
</script>
</body>
</html>
